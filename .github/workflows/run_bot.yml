name: Steem Auto-Vote Bot

on:
  schedule:
    # This runs the bot every 30 minutes. You can adjust this timing.
    - cron: '*/30 * * * *'
  workflow_dispatch: # Allows you to manually click a button to test run it anytime

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Project Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Upvote Script
      env:
        STEEM_POSTING_KEY: ${{ secrets.STEEM_POSTING_KEY }}
      run: python bot.py

    - name: Save Voted History Log
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add voted_posts.txt || true
        git commit -m "Update voted posts log [skip ci]" || true
        git push || true
