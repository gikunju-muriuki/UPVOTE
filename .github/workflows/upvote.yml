name: Steem Automatic Upvote Bot

on:
  schedule:
    # Runs every 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual verification tests via the UI button

jobs:
  auto-upvote:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Project Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beem requests

      - name: Run Upvote Bot
        env:
          STEEM_POSTING_KEY: ${{ secrets.STEEM_POSTING_KEY }}
        run: python upvote_bot.py
